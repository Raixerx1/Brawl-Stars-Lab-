name: Finish v0.36.1 source patch

on:
  push:
    branches: [finish-work-v0361]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v361-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: finish-work-v0361
          fetch-depth: 0

      - name: Apply source patch
        run: node scripts/apply-finish-v361.mjs

      - name: Commit source patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DraftAssistant.tsx src/components/VoiceDraftControl.tsx
          git commit -m "fix: finish direct React voice picks [v361-patched]"
          git push origin HEAD:finish-work-v0361
