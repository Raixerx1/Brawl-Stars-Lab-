name: Apply map meta v0.36.2

on:
  push:
    branches: [map-meta-v0362b]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[map-meta-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: map-meta-v0362b
          fetch-depth: 0

      - name: Apply scoring patch
        run: node scripts/apply-map-meta-v362.mjs

      - name: Commit scoring patch
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/draft-engine.ts
          git commit -m "refactor: integrate separate Ranked map prior [map-meta-patched]"
          git push origin HEAD:map-meta-v0362b
